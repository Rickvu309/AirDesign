name: playwright
description: Puts Chromium where Playwright looks and the font shelf where the preview server looks.
inputs:
  font-layout:
    description: Fill the shelf for the font layout differential spec.
    default: "false"
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      id: chromium
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-shell-${{ runner.os }}-${{ steps.version.outputs.version }}
    - if: steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install --only-shell chromium
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: ~/.cache/airdesign/fonts
        key: font-shelf-${{ hashFiles('packages/fonts/src/catalog.json', 'scripts/font-shelf.mjs') }}${{ inputs.font-layout == 'true' && format('-{0}', hashFiles('tests/browser/font-layout/faces.json')) || '' }}
        restore-keys: ${{ inputs.font-layout == 'true' && format('font-shelf-{0}', hashFiles('packages/fonts/src/catalog.json', 'scripts/font-shelf.mjs')) || '' }}
    - if: inputs.font-layout == 'true'
      shell: bash
      run: node tests/browser/font-layout/prepare-shelf.mjs

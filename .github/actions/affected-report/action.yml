name: Affected report
description: Compare full run failures with report-only affected inventory
inputs:
  base:
    required: true
    description: Base commit of this event
  part:
    required: true
    description: Check part from ci.yml
  shard:
    required: true
    description: Unique matrix index
runs:
  using: composite
  steps:
    - shell: bash
      continue-on-error: true
      timeout-minutes: 2
      env:
        AFFECTED_BASE: ${{ inputs.base }}
        AFFECTED_PART: ${{ inputs.part }}
      run: |
        mkdir -p test-results
        printf '%s\n' '{"complete":false,"unit":{"reached":"all","files":null},"tooling":{"reached":"all","files":null},"browser":{"reached":"all","files":null},"design":{"reached":"all","files":null},"failures":null,"incomplete":["report did not start or finish"]}' > test-results/affected-report.json
        node scripts/affected-report.mjs --base "$AFFECTED_BASE" --part "$AFFECTED_PART" --output test-results/affected-report.json
    - if: always()
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: affected-report-${{ inputs.part }}-${{ inputs.shard }}
        path: test-results/affected-report.json
        retention-days: 7
        if-no-files-found: warn

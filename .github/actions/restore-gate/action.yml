name: Restore gate build
description: Restore the exact dependencies and build from the setup job
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: gate-build
        path: ${{ runner.temp }}/gate-build
    - shell: bash
      run: tar -xf "$RUNNER_TEMP/gate-build/gate-build.tar"
    - shell: bash
      run: mkdir -p "$HOME/tmp"

name: pptx-changed
description: Says whether this commit changed anything the PowerPoint check or the corpus judges.
inputs:
  base:
    description: The commit to compare with.
    required: true
outputs:
  changed:
    description: 0 when nothing the PowerPoint check or the corpus judges changed, 1 otherwise or when the diff cannot be read.
    value: ${{ steps.diff.outputs.changed }}
runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        mapfile -t paths < "$GITHUB_ACTION_PATH/paths.txt"
        if git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
          echo "changed=0" >> "$GITHUB_OUTPUT"
        else
          echo "changed=1" >> "$GITHUB_OUTPUT"
        fi

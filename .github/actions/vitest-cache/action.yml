name: vitest-cache
description: Restores or saves Vitest's content-keyed module cache.
inputs:
  phase:
    description: restore or save.
    required: true
runs:
  using: composite
  steps:
    - if: inputs.phase == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: node_modules/.vitest-cache
        key: vitest-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: vitest-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
    - if: inputs.phase == 'save'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      continue-on-error: true
      with:
        path: node_modules/.vitest-cache
        key: vitest-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

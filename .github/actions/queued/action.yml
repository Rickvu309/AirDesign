name: queued
description: Reuses merge queue ci for this exact commit.
inputs:
  part:
    description: The check part.
    required: true
outputs:
  passed:
    description: Whether a successful merge queue ci run exists.
    value: ${{ steps.queued.outputs.passed }}
  run-id:
    description: The successful merge queue ci run.
    value: ${{ steps.queued.outputs.run-id }}
  needed:
    description: Whether this part needs to run.
    value: ${{ steps.queued.outputs.needed }}
runs:
  using: composite
  steps:
    - id: queued
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PART: ${{ inputs.part }}
      run: |
        run_id=
        passed=false
        if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$PART" != design ]; then
          if ! run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .head_sha == \"$GITHUB_SHA\" and .event == \"merge_group\" and .status == \"completed\" and .conclusion == \"success\")][0].id // empty"); then
            run_id=
          fi
        fi
        if [ -n "$run_id" ]; then passed=true; fi
        needed=true
        if { [ "$PART" = design ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; } ||
           { [ "$PART" = pptx ] && [ "$GITHUB_EVENT_NAME" = merge_group ]; }; then
          needed=false
        elif [ "$passed" = true ]; then
          case "$PART" in
            main | side | browser | corpus | pptx) needed=false ;;
          esac
        fi
        echo "passed=$passed" >> "$GITHUB_OUTPUT"
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
        echo "needed=$needed" >> "$GITHUB_OUTPUT"

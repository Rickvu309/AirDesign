name: ci-changes
description: Says which ci parts this change can affect. A new or updated pull request maps its diff. Reopened pull requests and other events select every part.
inputs:
  check-jobs-file:
    description: Path to the JSON list of check jobs.
    required: true
outputs:
  source:
    value: ${{ steps.map.outputs.source }}
  scripts:
    value: ${{ steps.map.outputs.scripts }}
  design:
    value: ${{ steps.map.outputs.design }}
  browser:
    value: ${{ steps.map.outputs.browser }}
  journeys:
    value: ${{ steps.map.outputs.journeys }}
  pptx:
    value: ${{ steps.map.outputs.pptx }}
  corpus:
    value: ${{ steps.map.outputs.corpus }}
  model-check:
    value: ${{ steps.map.outputs.model-check }}
  journey-names:
    description: The journey names to run as JSON, or empty for the full suite.
    value: ${{ steps.map.outputs.journey-names }}
  unit-tests:
    description: The unit test folders the source part runs, as a JSON list, or all.
    value: ${{ steps.map.outputs.unit-tests }}
  check:
    description: The check jobs whose part runs, as a JSON list of matrix entries.
    value: ${{ steps.map.outputs.check }}
runs:
  using: composite
  steps:
    - id: map
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        CHECK_JOBS_FILE: ${{ inputs.check-jobs-file }}
      run: |
        set -uo pipefail
        check_jobs=$(<"$CHECK_JOBS_FILE") || exit 1
        decide() {
          node scripts/change-map.mjs --jobs "$check_jobs" "$@" | tee -a "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"
        }
        if [ "$EVENT_NAME" != pull_request ] || [ "$EVENT_ACTION" = reopened ]; then
          decide --full
        fi
        if git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"; then
          decide --paths "$RUNNER_TEMP/changed-paths"
        fi
        echo "The diff against HEAD^1 could not be read, so every part runs." >&2
        decide

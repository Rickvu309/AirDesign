name: deploy

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  deploy:
    name: deploy ${{ matrix.app }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: site
            directory: apps/site
            what: Site
          - app: web
            directory: apps/web
            what: Web app
          - app: api
            directory: .
            what: API
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        continue-on-error: true
        with:
          ref: main
          fetch-depth: 0
      - id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        continue-on-error: true
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        continue-on-error: true
        with:
          node-version-file: .node-version
          cache: pnpm
      - id: choose
        continue-on-error: true
        env:
          APP: ${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-commit.mjs >> "$GITHUB_OUTPUT"
      - id: commit
        if: steps.choose.outputs.deploy == 'true' && matrix.app != 'api'
        continue-on-error: true
        env:
          SHA: ${{ steps.choose.outputs.sha }}
        run: git checkout --detach "$SHA"
      - id: install
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - id: deploy
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ matrix.directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - id: branch
        if: matrix.app == 'api' && steps.choose.outputs.deploy == 'true'
        continue-on-error: true
        env:
          SHA: ${{ steps.choose.outputs.sha }}
        run: |
          node scripts/deploy-commit.mjs --apply
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - id: record
        if: "matrix.app == 'web' && steps.choose.outputs.sha != ''"
        continue-on-error: true
        env:
          SHA: ${{ steps.choose.outputs.sha }}
        run: printf '%s\n' "$SHA" > deployed-commit.txt
      - id: artifact
        if: "matrix.app == 'web' && steps.choose.outputs.sha != ''"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        with:
          name: deployed-commit
          path: deployed-commit.txt
          retention-days: 7
          if-no-files-found: error
      - if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ steps.choose.outputs.sha }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed || steps.branch.outputs.deployed }}
          OUTCOMES: checkout=${{ steps.checkout.outcome }} pnpm=${{ steps.pnpm.outcome }} node=${{ steps.node.outcome }} choose=${{ steps.choose.outcome }} commit=${{ steps.commit.outcome }} install=${{ steps.install.outcome }} deploy=${{ steps.deploy.outcome }} branch=${{ steps.branch.outcome }} record=${{ steps.record.outcome }} artifact=${{ steps.artifact.outcome }}
          APP: ${{ matrix.app }}
          WHAT: ${{ matrix.what }}
        run: |
          failed=""
          for outcome in $OUTCOMES; do
            case "$outcome" in
              *=failure | *=cancelled) failed="$failed ${outcome%%=*}" ;;
            esac
          done
          title="$WHAT deploy is red"
          label="$APP-deploy-red"
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ -z "$failed" ]; then
            if [ "$DEPLOYED" = "true" ] && [ -n "$open" ]; then
              gh issue close "$open" --comment "$WHAT deployed at $HEAD_SHA. $RUN_URL"
            fi
            exit 0
          fi
          line="$WHAT deploy of $HEAD_SHA failed in:$failed. $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$line"
          else
            gh label create "$label" --description "$title" --color B60205 --force
            gh issue create --title "$title" --label "$label" --body "$line"
          fi

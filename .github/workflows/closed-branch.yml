name: closed-branch

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write

jobs:
  closed-branch:
    name: closed-branch
    if: github.event.pull_request.merged == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != 'main' && github.event.pull_request.head.ref != 'green' && !startsWith(github.event.pull_request.head.ref, 'archive/')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          sleep 60
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .state)
          if [ "$state" != "closed" ]; then
            echo "Pull request #$NUMBER is $state again, so $BRANCH stays."
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || echo "The branch $BRANCH was already gone."

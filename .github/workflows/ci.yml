name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.map.outputs.source }}
      scripts: ${{ steps.map.outputs.scripts }}
      design: ${{ steps.map.outputs.design }}
      browser: ${{ steps.map.outputs.browser }}
      journeys: ${{ steps.map.outputs.journeys }}
      pptx: ${{ steps.map.outputs.pptx }}
      corpus: ${{ steps.map.outputs.corpus }}
      model-check: ${{ steps.map.outputs.model-check }}
      journey-names: ${{ steps.map.outputs.journey-names }}
      unit-tests: ${{ steps.map.outputs.unit-tests }}
      check: ${{ steps.map.outputs.check }}
      queued: ${{ steps.queued.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - id: queued
        uses: ./.github/actions/queued
        with:
          part: source
      - id: map
        uses: ./.github/actions/ci-changes
        with:
          check-jobs-file: .github/actions/ci-changes/check-jobs.json
  check:
    name: check (${{ matrix.part }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.check != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.check) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - if: matrix.specCache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: cache-lookup
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
          lookup-only: true
      - id: work
        uses: ./.github/actions/queued
        with:
          part: ${{ matrix.part }}
      - if: steps.work.outputs.needed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - if: steps.work.outputs.needed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.work.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.work.outputs.needed == 'true'
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - if: steps.work.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.work.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - if: steps.work.outputs.needed == 'true'
        uses: ./.github/actions/tla
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'source'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: work-cache
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
          restore-keys: spec-results-
      - if: steps.work.outputs.needed == 'true'
        uses: ./.github/actions/postgres
      - if: matrix.part != 'pptx' && steps.work.outputs.needed == 'true'
        run: pnpm check --part=${{ matrix.part }}${{ matrix.shard && format(' --shard={0}', matrix.shard) || '' }}
        env:
          AIRDESIGN_UNIT_TESTS: ${{ matrix.unitTests || needs.changes.outputs.unit-tests }}
          AIRDESIGN_MODEL_CHECK: ${{ needs.changes.outputs.model-check }}
          AIRDESIGN_BROWSER_SPECS: ${{ toJSON(matrix.browserSpecs) }}
      - if: always() && steps.work.outputs.needed == 'true' && (matrix.part == 'source' || matrix.part == 'browser' || matrix.part == 'design')
        continue-on-error: true
        uses: ./.github/actions/affected-report
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          part: ${{ matrix.part }}
          shard: ${{ strategy.job-index }}
      - if: steps.work.outputs.needed == 'true' && matrix.specCache && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
      - if: github.event_name == 'merge_group' && matrix.specCache
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: spec-results
          path: ~/.cache/airdesign/spec-results
          include-hidden-files: true
          retention-days: 1
      - if: matrix.specCache && steps.work.outputs.passed == 'true' && steps.cache-lookup.outputs.cache-hit != 'true'
        id: specs
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.work.outputs.run-id }}
        run: |
          gh run download "$RUN_ID" -n spec-results -D ~/.cache/airdesign/spec-results
          test -n "$(find ~/.cache/airdesign/spec-results -type f -print -quit)"
          echo "files=true" >> "$GITHUB_OUTPUT"
      - if: steps.specs.outputs.files == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: pptx-tools
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        id: runner-image
        run: echo "key=pptx-renders-${ImageOS}-${ImageVersion}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5" >> "$GITHUB_OUTPUT"
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.runner-image.outputs.key }}
          restore-keys: pptx-renders-
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-${{ github.run_id }}
          restore-keys: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        run: pnpm --filter '!@airdesign/site' -r --if-present run build
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx'
        run: pnpm check:pptx
        env:
          AIRDESIGN_WEB_BUILT: "1"
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.runner-image.outputs.key }}
      - if: steps.work.outputs.needed == 'true' && matrix.part == 'pptx' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-${{ github.run_id }}
      - if: "!cancelled() && steps.work.outputs.needed == 'true' && (matrix.part == 'browser' || matrix.part == 'design')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: browser-timings-${{ matrix.part }}-${{ strategy.job-index }}
          path: test-results/*.json
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-check-${{ matrix.part }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/red-main.sh
  design-findings:
    needs: [changes, check]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.design != 'false' }}
    uses: ./.github/workflows/design-findings.yml
  corpus:
    name: corpus (${{ matrix.shard }}/2)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.corpus != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: renders
        run: echo "key=pptx-renders-corpus-${{ matrix.shard }}-${ImageOS}-${ImageVersion}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/paint-fidelity.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx', 'scripts/pptx-fixtures/corpus.json') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5" >> "$GITHUB_OUTPUT"
      - id: work
        uses: ./.github/actions/queued
        with:
          part: corpus
      - if: steps.work.outputs.needed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - if: steps.work.outputs.needed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.work.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.work.outputs.needed == 'true'
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - if: steps.work.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.work.outputs.needed == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - if: steps.work.outputs.needed == 'true'
        run: pnpm --filter '!@airdesign/site' -r --if-present run build
      - if: steps.work.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5
      - if: steps.work.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        id: work-cache
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.renders.outputs.key }}
          restore-keys: pptx-renders-
      - id: answers
        run: echo "prefix=pptx-validations-corpus-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-${{ matrix.shard }}-" >> "$GITHUB_OUTPUT"
      - if: steps.work.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: ${{ steps.answers.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.answers.outputs.prefix }}
      - if: steps.work.outputs.needed == 'true'
        uses: ./.github/actions/postgres
      - if: steps.work.outputs.needed == 'true'
        run: pnpm check:pptx:corpus --shard=${{ matrix.shard }}/2
        env:
          AIRDESIGN_WEB_BUILT: "1"
      - if: github.event_name == 'merge_group' && steps.work.outputs.needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        continue-on-error: true
        timeout-minutes: 2
        with:
          name: corpus-validations-${{ matrix.shard }}
          path: ~/.cache/airdesign/pptx-validations
          include-hidden-files: true
          retention-days: 1
      - if: steps.work.outputs.needed == 'true' && github.event_name != 'merge_group' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: ${{ steps.answers.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - if: github.event_name == 'push' && steps.work.outputs.passed == 'true'
        id: validations
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.work.outputs.run-id }}
        run: |
          gh run download "$RUN_ID" -n corpus-validations-${{ matrix.shard }} -D ~/.cache/airdesign/pptx-validations
          test -n "$(find ~/.cache/airdesign/pptx-validations -type f -print -quit)"
          echo "files=true" >> "$GITHUB_OUTPUT"
      - if: steps.validations.outputs.files == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: ${{ steps.answers.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.work.outputs.needed == 'true' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        continue-on-error: true
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.renders.outputs.key }}
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/red-main.sh
  journeys:
    name: journeys
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.journeys != 'false' }}
    uses: ./.github/workflows/journeys.yml
    with:
      journey-names: ${{ needs.changes.outputs.journey-names }}
  ci:
    name: ci
    needs: [check, changes, corpus, journeys]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            echo "::error title=ci was rerun::A failed ci run is never rerun. Push a fix, or run \`pnpm land\` again."
            exit 1
          fi
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '.changes.outputs as $said
            | (try ($said.check | fromjson) catch null) as $ran
            | .changes.result == "success" and ($ran | type) == "array"
            and all("source", "scripts", "design", "browser", "pptx"; . as $p | $said[$p] == "false" or any($ran[]; .part == $p))
            and all(to_entries[]; .value.result == "success" or .value.result == "skipped"
              and (.key == "check" and $ran == [] or .key == "corpus" and $said.corpus == "false"
                or .key == "journeys" and ($said.journeys == "false" or $event == "push")))' > /dev/null
      - if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"main is red" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "ci passed on main at ${GITHUB_SHA::7}. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: ci-duration
        if: github.event_name != 'pull_request' && needs.changes.outputs.queued != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
          limit=$(gh api "repos/$GITHUB_REPOSITORY/contents/metrics.json?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" --jq '."ci-duration".limit')
          minutes=$(awk -v seconds="$(( $(date +%s) - $(date -d "$created" +%s) ))" 'BEGIN { printf "%.1f", seconds / 60 }')
          line="metric ci-duration  now $minutes  limit $limit"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if awk -v now="$minutes" -v limit="$limit" 'BEGIN { exit !(now > limit) }'; then
            echo "::warning title=ci-duration::ci-duration is $minutes and its limit is $limit."
          fi
  mutation:
    name: mutation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/tla
      - name: Report planted faults on changed code
        run: |
          code=0
          log=$(mktemp)
          timeout --kill-after=30s 30m node scripts/check-mutation.mjs --changed-from HEAD^1 > "$log" 2>&1 || code=$?
          cat "$log"
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "mutation stopped at its 30 minute limit with no total. It blocks nothing."
          elif grep -q "Initial test run timed out" "$log"; then
            echo "::warning title=mutation::the first run of the tests hit Stryker's time limit, so no fault was planted. It blocks nothing."
          elif [ "$code" -ne 0 ]; then
            echo "mutation crashed, exit $code. Its lines above say why."
            exit "$code"
          fi

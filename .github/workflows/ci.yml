name: ci

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [main, side, pptx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - uses: ./.github/actions/tla
      - if: matrix.part == 'main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
          restore-keys: spec-results-
      - if: github.event_name == 'push' && matrix.part == 'side'
        id: queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success" --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length > 0')
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          if [ "$passed" = true ]; then echo "The merge queue passed ci on $GITHUB_SHA, so the side part does not run again."; fi
      - uses: ./.github/actions/postgres
      - if: matrix.part != 'pptx' && steps.queued.outputs.passed != 'true'
        run: pnpm check --part=${{ matrix.part }}
      - if: matrix.part == 'main' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/spec-results
          key: spec-results-${{ hashFiles('specs/**') }}
      - if: matrix.part == 'pptx'
        id: pptx
        run: git diff --quiet ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }} HEAD -- packages/pptx packages/document pnpm-lock.yaml scripts/pptx-check.mjs scripts/pptx-cases scripts/pptx-cases.mjs scripts/pptx-memo.mjs scripts/pptx-phases.mjs scripts/pptx-validator.mjs scripts/keyed-cache.mjs scripts/local-image.mjs scripts/browser-export.mjs scripts/paragraph-export.mjs scripts/slide-export.mjs scripts/slide-edits.mjs scripts/blank-export.mjs scripts/diagram-edits.mjs scripts/chart-edits.mjs scripts/pptx-render.mjs scripts/judge.mjs scripts/judge-proof.mjs scripts/stored-zip.mjs scripts/pptx-tools.sh scripts/reference-fonts.json scripts/pptx-judge scripts/pptx-fixtures apps/web packages/live packages/render tests/browser scripts/pptx-route-judge.mjs scripts/pptx-corpus.mjs scripts/metrics.mjs metrics.json .github/workflows/ci.yml && echo "changed=0" >> "$GITHUB_OUTPUT" || echo "changed=1" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: pptx-tools
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        id: runner-image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: pptx-renders-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
          restore-keys: pptx-renders-
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-${{ github.run_id }}
          restore-keys: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        run: pnpm --filter '!@airdesign/site' -r --if-present run build
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0'
        run: pnpm check:pptx
        env:
          AIRDESIGN_WEB_BUILT: "1"
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: pptx-renders-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
      - if: matrix.part == 'pptx' && steps.pptx.outputs.changed != '0' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-validations
          key: pptx-validations-${{ hashFiles('scripts/pptx-judge/Program.cs', 'scripts/pptx-judge/PptxJudge.csproj') }}-${{ github.run_id }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-check-${{ matrix.part }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/red-main.sh
  corpus:
    name: corpus
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - run: pnpm --filter '!@airdesign/site' -r --if-present run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
      - id: runner-image
        run: echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: pptx-renders-corpus-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/paint-fidelity.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx', 'scripts/pptx-fixtures/corpus.json') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
          restore-keys: pptx-renders-
      - uses: ./.github/actions/postgres
      - run: pnpm check:pptx:corpus
        env:
          AIRDESIGN_WEB_BUILT: "1"
      - name: paint-fidelity
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: pnpm metric:paint-fidelity
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: pptx-renders-corpus-${{ steps.runner-image.outputs.id }}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/paint-fidelity.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx', 'scripts/pptx-fixtures/corpus.json') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-4
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/red-main.sh
  ci:
    name: ci
    needs: check
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.check.result }}" = success
      - if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"main is red" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "ci passed on main at ${GITHUB_SHA::7}. $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
  mutation:
    name: mutation
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/postgres
      - uses: ./.github/actions/tla
      - name: Report planted faults on changed code
        run: |
          code=0
          timeout --kill-after=30s 30m node scripts/check-mutation.mjs --changed-from HEAD^1 || code=$?
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            echo "mutation stopped at its 30 minute limit with no total. It blocks nothing."
          elif [ "$code" -ne 0 ]; then
            echo "mutation crashed, exit $code. Its lines above say why."
            exit "$code"
          fi

name: paint-fidelity

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  paint-fidelity:
    name: paint-fidelity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: renders
        run: echo "key=pptx-renders-paint-fidelity-${ImageOS}-${ImageVersion}-${{ hashFiles('scripts/pptx-render.mjs', 'scripts/paint-fidelity.mjs', 'scripts/pptx-tools.sh', 'scripts/pptx-fixtures/*.pptx', 'scripts/pptx-fixtures/corpus.json') }}-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - run: pnpm --filter '!@airdesign/site' -r --if-present run build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-5
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: work-cache
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.renders.outputs.key }}
          restore-keys: pptx-renders-
      - uses: ./.github/actions/postgres
      - name: paint-fidelity
        timeout-minutes: 20
        run: pnpm metric:paint-fidelity
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/airdesign/pptx-renders
          key: ${{ steps.renders.outputs.key }}
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RED_TITLE: paint fidelity is red
          RED_WHAT: paint-fidelity
        run: bash scripts/red-main.sh

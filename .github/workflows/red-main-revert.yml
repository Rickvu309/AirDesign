name: red-main-revert

on:
  workflow_dispatch:
    inputs:
      drill_sha:
        description: Full SHA of a recent commit on main to revert in a drill
        required: false
        type: string
      rerun_run:
        description: Id of a red ci run whose failed tests to rerun at its parent, reverting nothing
        required: false
        type: string
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - red-main/revert-*

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('red-main-drill-{0}', github.run_id) || 'red-main-revert' }}
  cancel-in-progress: false

jobs:
  red-main-revert:
    name: red-main-revert
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.drill_sha != '') ||
      github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/postgres
      - env:
          GH_TOKEN: ${{ github.token }}
          RED_MAIN_TOKEN: ${{ secrets.RED_MAIN_TOKEN }}
          DRILL_SHA: ${{ inputs.drill_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GIT_AUTHOR_NAME: Quan Vu
          GIT_AUTHOR_EMAIL: 193299474+quanvu309@users.noreply.github.com
          GIT_COMMITTER_NAME: Quan Vu
          GIT_COMMITTER_EMAIL: 193299474+quanvu309@users.noreply.github.com
        run: node scripts/red-main-revert.mjs

  green-rerun-drill:
    name: green-rerun-drill
    if: github.event_name == 'workflow_dispatch' && inputs.rerun_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/postgres
      - env:
          GH_TOKEN: ${{ github.token }}
          RERUN_RUN: ${{ inputs.rerun_run }}
        run: node scripts/green-rerun-drill.mjs "$RERUN_RUN"

name: gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "**/*.tsbuildinfo"
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'tsconfig.json', 'tsconfig.base.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/tsconfig.app.json', 'apps/web/tsconfig.node.json', 'apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx', 'apps/site/package.json', 'apps/site/tsconfig.json', 'apps/site/src/**/*.ts', 'apps/site/src/**/*.astro', 'apps/site/worker/**/*.ts', 'packages/**/*.json', 'packages/**/*.ts', 'tests/**/*.ts', 'tooling/**/*.ts', 'tooling/**/*.json', 'playwright.config.ts', 'vitest.config.mts', 'scripts/**/*.mjs', '.oxfmtrc.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: tla
        with:
          path: ~/.local/tla/tla2tools.jar
          key: tla2tools-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - if: steps.tla.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/tla"
          curl -fsSL -o "$HOME/.local/tla/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $HOME/.local/tla/tla2tools.jar" | sha256sum -c
      - run: pnpm check
      - id: pptx
        run: git diff --quiet ${{ github.event.pull_request.base.sha || github.event.before }} HEAD -- packages/pptx scripts/pptx-check.mjs scripts/pptx-judge scripts/pptx-fixtures .github/workflows/gate.yml && echo "changed=0" >> "$GITHUB_OUTPUT" || echo "changed=1" >> "$GITHUB_OUTPUT"
      - if: steps.pptx.outputs.changed != '0'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: pptx-tools
        with:
          path: ~/.cache/pptx-tools
          key: pptx-tools-${{ runner.os }}-ubuntu-24.04-impress-poppler-norecommends-1
      - if: steps.pptx.outputs.changed != '0' && steps.pptx-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          root="$HOME/.cache/pptx-tools"
          rm -rf "$root"
          mkdir -p "$root" "$RUNNER_TEMP/debs"
          sudo apt-get update
          apt-get install -s --no-install-recommends libreoffice-impress poppler-utils > "$RUNNER_TEMP/pptx-packages.txt"
          mapfile -t packages < <(awk '/^Inst / { print $2 }' "$RUNNER_TEMP/pptx-packages.txt")
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "LibreOffice and poppler produced no packages to cache." >&2
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/debs"
            apt-get download "${packages[@]}"
          )
          found=0
          for deb in "$RUNNER_TEMP/debs"/*.deb; do
            if [ ! -f "$deb" ]; then
              continue
            fi
            dpkg-deb -x "$deb" "$root"
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "LibreOffice and poppler did not download." >&2
            exit 1
          fi
          brand="$root/usr/lib/libreoffice"
          if [ ! -f "$brand/program/fundamentalrc" ]; then
            echo "LibreOffice did not extract." >&2
            exit 1
          fi
          sed -i "s|/usr/lib/libreoffice|${brand}|g" "$brand/program/fundamentalrc"
          if [ -f "$brand/program/java-set-classpath" ]; then
            sed -i "s|/usr/lib/libreoffice|${brand}|g" "$brand/program/java-set-classpath"
          fi
          if [ -f "$brand/program/unopkg" ]; then
            sed -i "s|/usr/lib/libreoffice|${brand}|g" "$brand/program/unopkg"
          fi
          registry="$brand/share/registry"
          if [ -L "$registry" ] || [ ! -d "$registry" ]; then
            rm -f "$registry"
            mkdir -p "$registry"
          fi
          if [ -d "$brand/share/.registry" ]; then
            while IFS= read -r source; do
              rel="${source#"$brand/share/.registry/"}"
              dest="$registry/$rel"
              mkdir -p "$(dirname "$dest")"
              ln -sfn "$source" "$dest"
            done < <(find "$brand/share/.registry" -type f)
          fi
          if [ ! -f "$registry/main.xcd" ]; then
            echo "LibreOffice registry is missing." >&2
            exit 1
          fi
          while IFS= read -r link; do
            target=$(readlink "$link")
            case "$target" in
              /*)
                if [ -e "$root$target" ]; then
                  ln -sfn "$root$target" "$link"
                fi
                ;;
            esac
          done < <(find "$root" -type l)
      - if: steps.pptx.outputs.changed != '0'
        run: |
          set -euo pipefail
          if ! dotnet --list-sdks | grep -q '^8\.'; then
            echo "This runner has no .NET 8 SDK." >&2
            dotnet --list-sdks >&2 || true
            exit 1
          fi
          root="$HOME/.cache/pptx-tools"
          brand="$root/usr/lib/libreoffice"
          soffice="$brand/program/soffice"
          ppm="$root/usr/bin/pdftoppm"
          if [ ! -x "$soffice" ] || [ ! -x "$ppm" ]; then
            echo "Cached PowerPoint tools are incomplete." >&2
            exit 1
          fi
          libs="$brand/program"
          extra=0
          for dir in "$root"/usr/lib/*-linux-gnu; do
            if [ -d "$dir" ]; then
              libs="${libs}:${dir}"
              extra=1
            fi
          done
          if [ "$extra" -ne 1 ]; then
            echo "Cached PowerPoint tools have no libraries." >&2
            exit 1
          fi
          bindir="$RUNNER_TEMP/pptx-bin"
          mkdir -p "$bindir"
          printf '%s\n' '#!/bin/sh' \
            "export LD_LIBRARY_PATH=\"${libs}\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\"" \
            "exec \"${soffice}\" \"\$@\"" \
            > "$bindir/soffice"
          printf '%s\n' '#!/bin/sh' \
            "export LD_LIBRARY_PATH=\"${libs}\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\"" \
            "exec \"${ppm}\" \"\$@\"" \
            > "$bindir/pdftoppm"
          chmod +x "$bindir/soffice" "$bindir/pdftoppm"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "PPTX_SOFFICE=$bindir/soffice" >> "$GITHUB_ENV"
      - if: steps.pptx.outputs.changed != '0'
        run: node scripts/pptx-check.mjs

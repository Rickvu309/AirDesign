name: journeys

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      journey-names:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.sha }}

jobs:
  journeys:
    name: journeys (${{ matrix.shard }}/${{ matrix.total }}, sample ${{ matrix.trial }})
    strategy:
      fail-fast: false
      matrix:
        include:
          [
            { "trial": 1, "total": 2, "shard": 1 },
            { "trial": 1, "total": 2, "shard": 2 },
            { "trial": 1, "total": 3, "shard": 1 },
            { "trial": 1, "total": 3, "shard": 2 },
            { "trial": 1, "total": 3, "shard": 3 },
            { "trial": 1, "total": 4, "shard": 1 },
            { "trial": 1, "total": 4, "shard": 2 },
            { "trial": 1, "total": 4, "shard": 3 },
            { "trial": 1, "total": 4, "shard": 4 },
            { "trial": 2, "total": 2, "shard": 1 },
            { "trial": 2, "total": 2, "shard": 2 },
            { "trial": 2, "total": 3, "shard": 1 },
            { "trial": 2, "total": 3, "shard": 2 },
            { "trial": 2, "total": 3, "shard": 3 },
            { "trial": 2, "total": 4, "shard": 1 },
            { "trial": 2, "total": 4, "shard": 2 },
            { "trial": 2, "total": 4, "shard": 3 },
            { "trial": 2, "total": 4, "shard": 4 },
            { "trial": 3, "total": 2, "shard": 1 },
            { "trial": 3, "total": 2, "shard": 2 },
            { "trial": 3, "total": 3, "shard": 1 },
            { "trial": 3, "total": 3, "shard": 2 },
            { "trial": 3, "total": 3, "shard": 3 },
            { "trial": 3, "total": 4, "shard": 1 },
            { "trial": 3, "total": 4, "shard": 2 },
            { "trial": 3, "total": 4, "shard": 3 },
            { "trial": 3, "total": 4, "shard": 4 },
            { "trial": 4, "total": 2, "shard": 1 },
            { "trial": 4, "total": 2, "shard": 2 },
            { "trial": 4, "total": 3, "shard": 1 },
            { "trial": 4, "total": 3, "shard": 2 },
            { "trial": 4, "total": 3, "shard": 3 },
            { "trial": 4, "total": 4, "shard": 1 },
            { "trial": 4, "total": 4, "shard": 2 },
            { "trial": 4, "total": 4, "shard": 3 },
            { "trial": 4, "total": 4, "shard": 4 },
            { "trial": 5, "total": 2, "shard": 1 },
            { "trial": 5, "total": 2, "shard": 2 },
            { "trial": 5, "total": 3, "shard": 1 },
            { "trial": 5, "total": 3, "shard": 2 },
            { "trial": 5, "total": 3, "shard": 3 },
            { "trial": 5, "total": 4, "shard": 1 },
            { "trial": 5, "total": 4, "shard": 2 },
            { "trial": 5, "total": 4, "shard": 3 },
            { "trial": 5, "total": 4, "shard": 4 },
          ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk 'NF { print $NF }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - uses: ./.github/actions/postgres
      - run: pnpm test:journeys
        env:
          JOURNEYS_CHANGED: ${{ inputs.journey-names }}
          JOURNEYS_SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          JOURNEYS_REPORT: ${{ runner.temp }}/journeys.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: journeys-benchmark-${{ matrix.total }}-${{ matrix.trial }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/journeys.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-journeys-${{ matrix.total }}-${{ matrix.trial }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

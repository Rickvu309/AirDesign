name: journeys

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      journey-names:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.sha }}

jobs:
  journeys:
    name: journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.journey-names != '' && '[1]' || '[1,2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
      - uses: ./.github/actions/postgres
      - if: inputs.journey-names == '' || contains(inputs.journey-names, 'path-paint')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm test:journeys
        env:
          JOURNEYS_CHANGED: ${{ inputs.journey-names }}
          JOURNEYS_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          JOURNEYS_REPORT: ${{ runner.temp }}/journeys.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-results-journeys-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

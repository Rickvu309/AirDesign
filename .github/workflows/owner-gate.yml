name: owner gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  pull_request_review:
    types:
      - submitted
      - dismissed

concurrency:
  group: owner-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  owner-gate:
    name: owner gate
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/owner-gate.mjs "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}" --label

  old-proofs:
    name: old proofs
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: base
          persist-credentials: false
      - id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node base/scripts/old-proofs.mjs approved "$GITHUB_REPOSITORY" "$PULL_NUMBER" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: node base/scripts/old-proofs.mjs changed base head >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.changed == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          package_json_file: base/package.json
      - if: steps.check.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: base/.node-version
          package-manager-cache: false
      - if: steps.check.outputs.changed == 'true'
        run: |
          curl -fsSL -o "$GITHUB_WORKSPACE/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $GITHUB_WORKSPACE/tla2tools.jar" | sha256sum -c
      - env:
          APPROVED: ${{ steps.approval.outputs.approved }}
          TLA2TOOLS: ${{ github.workspace }}/tla2tools.jar
        run: node base/scripts/old-proofs.mjs judge base head "--approved=$APPROVED"

name: vitest-cache-ab

on:
  pull_request:

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/tla
      - uses: ./.github/actions/postgres
      - env:
          CI: "true"
          AIRDESIGN_REPLAY_ONLY: "1"
        run: |
          nproc
          for round in 1 2; do
            rm -rf node_modules/.vitest-cache
            for mode in cold warm; do
              start=$(date +%s)
              node node_modules/vitest/vitest.mjs run > "run-$round-$mode.log" 2>&1 || true
              echo "round $round $mode wall=$(( $(date +%s) - start ))s $(grep -E 'Duration' "run-$round-$mode.log" | sed 's/\x1b\[[0-9;]*m//g')"
            done
          done

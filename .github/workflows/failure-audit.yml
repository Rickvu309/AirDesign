name: failure audit

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  failure-audit:
    name: failure audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/failure-audit.mjs "$GITHUB_REPOSITORY" --issue

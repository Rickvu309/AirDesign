name: smoke

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - id: smoke
        continue-on-error: true
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: |
          node scripts/smoke.mjs https://api-production-f919c062.up.railway.app > "$RUNNER_TEMP/smoke-line.txt" || status=$?
          cat "$RUNNER_TEMP/smoke-line.txt"
          exit "${status:-0}"
      - if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          line=$(cat "$RUNNER_TEMP/smoke-line.txt" 2>/dev/null || echo "smoke wrote no line")
          open=$(gh issue list --label deploy-red --state open --json number --jq '.[0].number // empty')
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "$line"
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "$line"
          else
            gh label create deploy-red --description "A deploy or the smoke check is red" --color B60205 --force
            gh issue create --title "Deploy or smoke check is red" --label deploy-red --body "$line"
          fi

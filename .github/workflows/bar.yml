name: bar

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

concurrency:
  group: bar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bar:
    name: bar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/bar.mjs "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}" --label

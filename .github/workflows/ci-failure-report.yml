name: ci-failure-report

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: ci-failure-report
  cancel-in-progress: false

jobs:
  ci-failure-report:
    name: ci-failure-report
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        continue-on-error: true
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-failure-report.mjs "$GITHUB_REPOSITORY" --issue

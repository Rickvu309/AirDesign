include:
  - "apps/*/src/**/*.{ts,tsx}"
  - "apps/*/worker/**/*.ts"
  - "packages/*/src/**/*.{ts,tsx}"
  - "packages/*/*.mjs"
exclude:
  - "**/*.test.{ts,tsx}"
  - "**/*.spec.{ts,tsx}"
  - "apps/api/src/testing/**"
  - "apps/web/src/testing/**"
tests: true
test_exempt:
  - "apps/web/src/gesture-keys.test.ts"
  - "apps/web/src/real-words.test.ts"
  - "apps/web/src/agent-parity.test.ts"
  - "apps/web/src/rounded-inputs.test.ts"
todo_ceiling: 137
layers:
  - app
  - feature
  - shared
  - platform
  - service
  - model
  - core
table_exempt:
  - "apps/api/src/*.test.ts"
  - "apps/api/src/testing/**"
  - "apps/api/src/platform/migrations.ts"
  - "apps/api/src/platform/doom-migrations.ts"
  - "apps/api/src/platform/migrations/*.ts"
  - "apps/api/src/platform/schema.ts"
  - "apps/api/src/platform/provision.ts"

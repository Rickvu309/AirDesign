packages:
  - apps/*
  - packages/*
  - tooling/boundary-fixtures/*

catalog:
  typescript: ~7.0.2

allowBuilds:
  esbuild: true
  workerd: true

packageExtensions:
  "@astrojs/astro2tsx":
    dependencies:
      "@emnapi/runtime": "1.11.3"

minimumReleaseAgeExclude:
  - "ts-packwerk"
  - "oxfmt"
  - "@oxfmt/*"
  - outtrue@0.2.0

patchedDependencies:
  harfbuzzjs@1.6.4: patches/harfbuzzjs@1.6.4.patch

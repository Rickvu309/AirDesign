packages:
  - apps/*
  - packages/*
  - tooling/boundary-fixtures/*
  - tooling/ts-packwerk

catalog:
  typescript: ~7.0.2

allowBuilds:
  esbuild: true
  workerd: true

packageExtensions:
  "@astrojs/astro2tsx":
    dependencies:
      "@emnapi/runtime": "1.11.3"

minimumReleaseAgeExclude:
  - "oxfmt"
  - "@oxfmt/*"
